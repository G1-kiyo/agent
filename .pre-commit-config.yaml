repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.16.7
  hooks:
    # Run the linter.
    - id: ruff-check
      files: ^backend/
    # Run the formatter.
    - id: ruff-format
      files: ^backend/

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v3.2.0
  hooks:
    -  id: trailing-whitespace
       files: ^backend/
    -  id: check-yaml
       files: ^backend/
    -  id: check-added-large-files
       files: ^backend/

- repo: local
  hooks:
    -  id: eslint
       name: eslint
       entry: bash -c "cd frontend && npm run lint"
       language: node
       additional_dependencies:
          - eslint@^8.57.0
       files: ^frontend/.*\.(js|ts|jsx|tsx)$

